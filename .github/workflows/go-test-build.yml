name: Go Test & Build

on:
  push:
    branches: [Lexvia]
  pull_request:
    branches: [Lexvia]

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build backend packages
        run: go build -v ./model/ ./common/ ./service/ ./middleware/ ./relay/ ./controller/ ./router/

      - name: Run unit tests
        run: go test -v -short ./...
